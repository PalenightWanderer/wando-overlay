<!doctype html>
<html lang="en" data-theme="dark">
<meta charset="utf-8">
<title>Wander Overlay wrist clock</title>
<link rel="stylesheet" href="theme.css">
<style>
body { padding: 6px; }
main { display: flex; height: 158px; background: var(--surface); border: 2px solid var(--frame); border-radius: 22px; overflow: hidden; }
#clock { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding-left: 20px; }
#time { font-size: 54px; font-weight: 600; line-height: 66px; white-space: nowrap; }
#session { font-size: 25px; color: var(--muted); white-space: nowrap; }
/* Slim, full-height targets for the other hand's laser. */
main button { width: 72px; border: 0; border-left: 2px solid var(--frame); border-radius: 0; background: var(--raised); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; }
main button:hover { background: var(--hover); } main button:active { background: var(--accent); }
#summon i { display: block; width: 32px; height: 6px; border-radius: 3px; background: var(--text); }
/* Keyboard glyph: an outlined board with a row of keys and a space bar. */
#keys span { width: 44px; height: 30px; border: 4px solid var(--text); border-radius: 7px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px; }
#keys i { display: block; width: 6px; height: 5px; background: var(--text); } #keys i:last-child { width: 24px; }
</style>
<main>
  <div id="clock"><div id="time">--:--</div><div id="session">SteamVR session</div></div>
  <button id="keys" type="button" title="Show or hide the keyboard"><span><i></i><i></i><i></i><i></i></span></button>
  <button id="summon" type="button" title="Open or close the dashboard"><i></i><i></i><i></i></button>
</main>
<script>
// Presentation only. Rust supplies the clock text and consumes queued actions.
const actions = [];
for (const [id, action] of [['summon', 'dashboard'], ['keys', 'keyboard']])
  document.getElementById(id).addEventListener('click', () => { if (!actions.length) actions.push(action); });
window.drainActions = () => actions.splice(0).join('\n');
window.setTheme = name => { document.documentElement.dataset.theme = name; };
window.setClock = (time, session) => {
  document.getElementById('time').textContent = time;
  document.getElementById('session').textContent = 'SteamVR ' + session;
};
window.loReady = true;
</script>
</html>
